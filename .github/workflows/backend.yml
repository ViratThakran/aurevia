name: backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_admin_password  # CI-only throwaway database
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_admin" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      AUREVIA_TEST_DATABASE_URL: postgresql://ci_admin:ci_admin_password@localhost:5432/postgres
      AUREVIA_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
