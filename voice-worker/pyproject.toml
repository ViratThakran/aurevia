[project]
name = "aurevia-voice-worker"
version = "0.1.0"
description = "Aurevia voice worker: LiveKit Agents runtime for browser (and later phone) calls"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "livekit-agents>=1.2",
    "livekit-plugins-cartesia>=1.8.4",
    "livekit-plugins-deepgram>=1.8.4",
    "livekit-plugins-silero>=1.8.4",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurevia_voice"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests"]
