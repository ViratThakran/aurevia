[project]
name = "aurevia-backend"
version = "0.1.0"
description = "Aurevia AI Sales Agent — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "email-validator>=2.2",
    "anthropic>=1.0",
    "livekit-api>=1.0",
    "google-genai>=1.0",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurevia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and literal throwaway secrets.
"tests/**" = ["S101", "S105", "S106", "S608"]
# Migrations interpolate the application role name, validated against a strict identifier
# pattern first; DDL cannot take bind parameters.
"alembic/versions/**" = ["S608"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
