# Local development stack. Credentials come from `.env` (see `.env.example`);
# compose refuses to start if they are missing — there are no defaults.
#
# Two database roles, as in production:
#   POSTGRES_USER  owns the schema; used only to run migrations.
#   aurevia_app    what the API connects as; subject to row-level security.
services:
  api:
    build: .
    env_file: .env
    environment:
      AUREVIA_DATABASE_URL: postgresql+asyncpg://aurevia_app:${AUREVIA_APP_DB_PASSWORD:?set AUREVIA_APP_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      AUREVIA_MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      # env_file passes the whole .env; speech keys belong to the voice worker only.
      DEEPGRAM_API_KEY: ""
      CARTESIA_API_KEY: ""
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn aurevia.main:create_app --factory
        --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      AUREVIA_APP_DB_PASSWORD: ${AUREVIA_APP_DB_PASSWORD:?set AUREVIA_APP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Browser voice (Phase 2): `docker compose --profile voice up` ------------------------
  # LiveKit runs in dev mode (well-known dev keys "devkey"/"secret", local use only) and
  # advertises 127.0.0.1 for media, which the browser on this machine reaches through the
  # published ports.
  livekit:
    profiles: [voice]
    image: livekit/livekit-server:latest
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    # Redis links the media server with the SIP service; webhooks (signed with the dev key)
    # tell the API when rooms end and when a phone line rings in.
    environment:
      LIVEKIT_CONFIG: |
        redis:
          address: redis:6379
        webhook:
          api_key: devkey
          urls:
            - http://api:8000/webhooks/livekit
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    depends_on:
      - redis

  redis:
    profiles: [voice]
    image: redis:7-alpine

  # --- Phone calls (Phase 6): `docker compose --profile voice --profile telephony up` -------
  # LiveKit SIP bridges the carrier's SIP trunk (Exotel) into LiveKit rooms. A carrier must
  # reach this service over the internet, so real calls need a host with a public IP; on a
  # laptop it only starts. See docs/02-voice/telephony.md.
  livekit-sip:
    profiles: [telephony]
    image: livekit/sip:latest
    environment:
      SIP_CONFIG_BODY: |
        api_key: devkey
        api_secret: secret
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        sip_port: 5060
        rtp_port: 10000-10100
        use_external_ip: false
    ports:
      - "127.0.0.1:5060:5060/udp"
      - "127.0.0.1:5060:5060/tcp"
      - "127.0.0.1:10000-10100:10000-10100/udp"
    depends_on:
      - livekit
      - redis

  # Shares LiveKit's network namespace so that "127.0.0.1" means the same thing to the worker
  # as to the media server. Speech keys live only here, never in the API container; the
  # worker gets no model key (no env_file): it never calls a model.
  voice-worker:
    profiles: [voice]
    build: ../voice-worker
    network_mode: "service:livekit"
    environment:
      AUREVIA_BACKEND_URL: http://api:8000
      AUREVIA_STT_PROVIDER: ${AUREVIA_STT_PROVIDER:-deepgram}
      AUREVIA_TTS_PROVIDER: ${AUREVIA_TTS_PROVIDER:-cartesia}
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
    depends_on:
      - livekit
      - api

  # The browser test page, at http://localhost:3000 (or VOICE_TEST_PORT)
  voice-test:
    profiles: [voice]
    image: nginx:alpine
    volumes:
      - ../web/voice-test:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${VOICE_TEST_PORT:-3000}:80"

volumes:
  pgdata:
