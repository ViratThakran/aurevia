# Rotates the host-side logs written by the backup cron job. Install (as root):
#   sudo cp deploy/cron/aurevia-logrotate.conf /etc/logrotate.d/aurevia
# Container logs are rotated by Docker itself (10 MB x 5 files per container, see the
# `logging` block in docker-compose.prod.yml).
/var/log/aurevia-backup.log {
    weekly
    rotate 8
    compress
    missingok
    notifempty
}
